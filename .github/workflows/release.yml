name: Construire et publier le widget

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le SDK .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publier le fichier Windows autonome
        shell: pwsh
        run: >-
          dotnet publish MailWidget.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=1.0.${{ github.run_number }}

      - name: Publier le gestionnaire Windows autonome
        shell: pwsh
        run: >-
          dotnet publish WidgetSetup/WidgetSetup.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=1.0.${{ github.run_number }}
      - name: Signer l'exécutable Windows si le certificat est configuré
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            Write-Host "Aucun certificat de signature configuré : publication non signée."
            exit 0
          }

          $publishDirectory = Join-Path $env:GITHUB_WORKSPACE "bin\Release\net8.0-windows\win-x64\publish"
          $setupPublishDirectory = Join-Path $env:GITHUB_WORKSPACE "WidgetSetup\bin\Release\net8.0-windows\win-x64\publish"
          $executablePaths = @(
            (Join-Path $publishDirectory "MailWidget.exe")
            (Join-Path $setupPublishDirectory "GestionWidget.exe")
          )
          $certificatePath = Join-Path $env:RUNNER_TEMP "widget-signing.pfx"
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64)
          [System.IO.File]::WriteAllBytes($certificatePath, $certificateBytes)

          try {
            $kitsDirectory = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
            $signTool = Get-ChildItem -Path $kitsDirectory -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Directory.Name -eq "x64" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if (-not $signTool) {
              throw "signtool.exe est introuvable sur le runner Windows."
            }

            foreach ($executablePath in $executablePaths) {
              & $signTool.FullName sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /tr "https://timestamp.digicert.com" /td SHA256 $executablePath
              if ($LASTEXITCODE -ne 0) {
                throw "La signature Authenticode d'un exécutable a échoué."
              }

              & $signTool.FullName verify /pa /all $executablePath
              if ($LASTEXITCODE -ne 0) {
                throw "La vérification de la signature d'un exécutable a échoué."
              }
            }
          }
          finally {
            Remove-Item -Path $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Préparer le paquet et le manifeste
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: 1.0.${{ github.run_number }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $publishDirectory = Join-Path $env:GITHUB_WORKSPACE "bin\Release\net8.0-windows\win-x64\publish"
          $setupPublishDirectory = Join-Path $env:GITHUB_WORKSPACE "WidgetSetup\bin\Release\net8.0-windows\win-x64\publish"
          $setupPath = Join-Path $setupPublishDirectory "GestionWidget.exe"
          $stagingDirectory = Join-Path $env:RUNNER_TEMP "widget-personnalise-staging"
          $packagePath = Join-Path $env:RUNNER_TEMP "WidgetPersonnalise-win-x64.zip"
          $manifestPath = Join-Path $env:RUNNER_TEMP "latest.json"

          if (-not (Test-Path (Join-Path $publishDirectory "MailWidget.exe"))) {
            throw "MailWidget.exe est absent du dossier publié."
          }

          if (-not (Test-Path $setupPath)) {
            throw "GestionWidget.exe est absent du dossier publié."
          }

          New-Item -ItemType Directory -Path $stagingDirectory -Force | Out-Null
          Copy-Item -Path (Join-Path $publishDirectory "*") -Destination $stagingDirectory -Recurse -Force
          Remove-Item -Path (Join-Path $stagingDirectory "credentials.json") -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $stagingDirectory "*") -DestinationPath $packagePath -Force

          $hash = (Get-FileHash -Path $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $env:RELEASE_VERSION
            downloadUrl = "https://github.com/$env:RELEASE_REPOSITORY/releases/latest/download/WidgetPersonnalise-win-x64.zip"
            sha256 = $hash
            notes = "Mise à jour automatique du Widget personnalisé."
          }
          $manifest | ConvertTo-Json | Set-Content -Path $manifestPath -Encoding utf8

          "package_path=$packagePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest_path=$manifestPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setup_path=$setupPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Mettre à jour la version publiée
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packagePath = "${{ steps.package.outputs.package_path }}"
          $manifestPath = "${{ steps.package.outputs.manifest_path }}"
          $setupPath = "${{ steps.package.outputs.setup_path }}"
          $releaseExists = gh release view latest --repo "${{ github.repository }}" 2>$null

          if ($LASTEXITCODE -eq 0) {
            gh release upload latest $packagePath $manifestPath $setupPath --clobber --repo "${{ github.repository }}"
          }
          else {
            gh release create latest $packagePath $manifestPath $setupPath `
              --repo "${{ github.repository }}" `
              --title "Widget personnalisé — dernière version" `
              --notes "Version publiée automatiquement depuis la branche main." `
              --target "${{ github.sha }}" `
              --latest
          }
